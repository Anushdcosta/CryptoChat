name: Build and Release Electron App

on:
  push:
    tags:
      - 'v*' # Triggers workflow only when you push a tag like v1.0.0, v1.1.0, etc.

jobs:
  build:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Vite App
        working-directory: ./frontend
        run: npm run build

      - name: Build Electron App & Publish to Release
        working-directory: ./frontend
        # Runs electron-builder for the current matrix OS and uploads artifacts to the GitHub release
        run: npx electron-builder --publish always
        env:
          # Automatically provided by GitHub Actions to allow uploading to your releases
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
